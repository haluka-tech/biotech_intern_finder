<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biotech Intern Finder | Automated Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #0284c7;
            --text-color: #f8fafc;
            --border-color: #334155;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 {
            font-size: 1.75rem;
            margin: 0;
            color: #38bdf8;
        }
        .refreshed {
            color: #94a3b8;
            margin: 0.35rem 0 0 0;
            font-size: 0.85rem;
        }
        .badge {
            background: #0369a1;
            padding: 0.35rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.85rem;
        }
        .table-container {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow-x: auto;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border-color);
        }
        th {
            background-color: #0f172a;
            color: #94a3b8;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        tr:last-child td {
            border-bottom: none;
        }
        .job-title {
            font-weight: 600;
            color: #ffffff;
        }
        .tag {
            display: inline-block;
            background: #0f172a;
            border: 1px solid #0284c7;
            color: #38bdf8;
            padding: 0.15rem 0.45rem;
            border-radius: 4px;
            font-size: 0.75rem;
            margin: 0.1rem;
        }
        .apply-btn {
            display: inline-block;
            background: var(--accent-color);
            color: white;
            padding: 0.45rem 0.85rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.85rem;
            transition: background 0.2s;
        }
        .apply-btn:hover {
            background: #0369a1;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>🧫 Biotech Internship Finder</h1>
                <p style="color: #94a3b8; margin: 0.25rem 0 0 0; font-size: 0.9rem;">Automated target company scan powered by OpenRouter</p>
                <p class="refreshed">Last refreshed: <time datetime="2026-11-13T15:39:37Z">13 Nov 2026, 15:39 UTC</time></p>
            </div>
            <div class="badge">Active Roles Found: 0</div>
        </header>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Company</th>
                        <th>Position Title</th>
                        <th>Location</th>
                        <th>Matched Keywords</th>
                        <th>Summary</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    
        <tr>
            <td colspan="6" style="text-align: center; padding: 40px; color: #94a3b8;">
                No active biotech internships matching target keywords were found in this run.
            </td>
        </tr>
        
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
